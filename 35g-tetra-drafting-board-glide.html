<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>35·G · Tetra Drafting Board — Measuring Depth Levels</title>
<style>
  :root{
    --paper:#f3efe4; --ink:#22201c; --table:#2e2a24; --tray-ink:#efe9da;
    --tray-dim:#bdb4a1; --tray-line:#6b6353; --accent:#e0a51e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; height:100dvh; display:flex; flex-direction:column;
    background:var(--table);
    font-family:"Avenir Next","Futura","Century Gothic","Trebuchet MS",sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #sheetwrap{flex:1; min-height:0; display:flex; align-items:center;
    justify-content:center; padding:10px;}
  canvas{background:var(--paper); border-radius:2px; touch-action:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06) inset;}
  #tray{
    background:var(--table); color:var(--tray-ink);
    border-top:1px solid #423c33;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
    display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
    font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;
  }
  .lab{letter-spacing:.16em; text-transform:uppercase; font-size:9px;
    color:var(--tray-dim); font-family:inherit;}
  .ctl{display:flex; align-items:center; gap:7px}
  input[type=range]{width:104px; accent-color:var(--accent)}
  .val{min-width:3.2em; text-align:right; color:var(--tray-ink)}
  .chip{
    font:inherit; letter-spacing:.14em; text-transform:uppercase; font-size:9px;
    border:1px solid var(--tray-line); background:transparent; color:var(--tray-ink);
    padding:5px 10px; border-radius:2px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--tray-ink); color:var(--table);
    border-color:var(--tray-ink);}
  .chip:focus-visible, input:focus-visible{outline:2px solid var(--accent);
    outline-offset:2px;}
  #readout{margin-left:auto; color:var(--tray-dim)}
  #readout b{color:var(--tray-ink); font-weight:600}
  @media (max-width:640px){ input[type=range]{width:76px} #readout{width:100%} }
</style>
</head>
<body>
<div id="sheetwrap"><canvas id="sheet" aria-label="Drafting sheet: plan, elevation, transfer, and a front view where the glide armature and cross-slit projection share measured depth levels"></canvas></div>
<div id="tray">
  <span class="ctl"><span class="lab">Zv&nbsp;red</span>
    <input id="sZv" type="range" min="60" max="240" step="1" value="103">
    <span class="val" id="vZv">103</span></span>
  <span class="ctl"><span class="lab">Zh&nbsp;blue</span>
    <input id="sZh" type="range" min="61" max="330" step="1" value="250">
    <span class="val" id="vZh">250</span></span>
  <span class="ctl"><span class="lab">Near</span>
    <input id="sNear" type="range" min="340" max="640" step="5" value="435">
    <span class="val" id="vNear">435</span></span>
  <span class="ctl"><span class="lab">Far</span>
    <input id="sFar" type="range" min="420" max="700" step="5" value="675">
    <span class="val" id="vFar">675</span></span>
  <button class="chip" id="cTrace" aria-pressed="true">Trace</button>
  <button class="chip" id="cSweep" aria-pressed="false">Sweep</button>
  <button class="chip" id="cGl" aria-pressed="true">Glide</button>
  <button class="chip" id="cCS" aria-pressed="true">Cross-slit</button>
  <button class="chip" id="cPin" aria-pressed="false">Pinhole</button>
  <button class="chip" id="cAxes" aria-pressed="true">Axes</button>
  <button class="chip" id="cLab" aria-pressed="true">Labels</button>
  <button class="chip" id="cGrid" aria-pressed="true">Grid</button>
  <span id="readout"></span>
</div>
<noscript>This sheet needs JavaScript.</noscript>

<script>
/* ============================================================
   GlideMath — closed forms, exposed for the headless check
   (smoke_glide_board.js). Rig convention as sheet 35: red slit
   l1 vertical at z = Zv; blue slit l2 horizontal at z = Zh;
   scene beyond both slits; picture plane carried on the volume
   (c = near), the front face lying in it at true size.

   MEASURED DEPTH LEVELS. Depth is measured in 16 levels from the
   picture plane (level 0) to the back wall (level 16, z = far).
   Both readings are calibrated to agree at both ends:

   Cross-slit (rays):  X = x(c-Zv)/(z-Zv),  Y = y(c-Zh)/(z-Zh)
   Glide (armature):   with t = (z-c)/(far-c),
       su = (c-Zv)/(far-Zv),  sv = (c-Zh)/(far-Zh)
       X = x(1 + t(su-1)),    Y = y(1 + t(sv-1))

   The glide is the straight, linearly graduated armature drawn
   through the cross-slit's back-wall image: level marks fall
   equally spaced along its depth lines (measurable), while the
   cross-slit's marks crowd toward A. Beyond level 16 the glide
   exhausts at finite depth — its lines cross the horizontal
   vanishing axis pairwise at h1/h2 at z = c+(far-Zh) and the
   vertical axis at v1/v2 at z = c+(far-Zv) — while the cross-slit
   reaches A only at infinity. h1, A, h2 share one vanishing axis:
   the limit of measured depth. v1, v2 lie deeper still and are
   directional only.
   ============================================================ */
/* GLIDE-MATH-BEGIN */
(function(){
  function project(P, c, Zv, Zh){
    return { X: P.x * (c - Zv) / (P.z - Zv),
             Y: P.y * (c - Zh) / (P.z - Zh) };
  }
  function glide(P, c, Zv, Zh, far){
    var su=(c-Zv)/(far-Zv), sv=(c-Zh)/(far-Zh), t=(P.z-c)/(far-c);
    return { X: P.x * (1 + t*(su-1)),
             Y: P.y * (1 + t*(sv-1)) };
  }
  function crossRatio(A,B,C,D){ return ((C-A)*(D-B))/((C-B)*(D-A)); }
  function vPoint(y, c, Zv, Zh, far){ /* same-y armature lines meet here on X=0 */
    return { z: c + (far - Zv), Y: y*(Zv-Zh)/(far-Zh) };
  }
  function hPoint(x, c, Zv, Zh, far){ /* same-x armature lines meet here on Y=0 */
    return { z: c + (far - Zh), X: x*(Zh-Zv)/(far-Zv) };
  }
  function level(z, c, far){ return 16*(z-c)/(far-c); }     /* measured depth */
  function zOfLevel(L, c, far){ return c + L*(far-c)/16; }
  var GM = { project:project, glide:glide, crossRatio:crossRatio,
             vPoint:vPoint, hPoint:hPoint, level:level, zOfLevel:zOfLevel };
  if (typeof window !== 'undefined') window.GlideMath = GM;
  if (typeof module !== 'undefined' && module.exports) module.exports = GM;
})();
/* GLIDE-MATH-END */

(function(){
if (typeof document === 'undefined') return;

/* ---------------- palette (matches Kevin's sheets) ---------------- */
var INK='#22201c', RED='#c8352b', BLUE='#1f4fd8', YEL='#d99e14',
    PUR='#7a3fa8', ORG='#e07020', TEA='#177f75', GRN='#3d8f3d', PAPER='#f3efe4';
var inkA=function(a){return 'rgba(34,32,28,'+a+')';};
var redA=function(a){return 'rgba(200,53,43,'+a+')';};
var bluA=function(a){return 'rgba(31,79,216,'+a+')';};
var purA=function(a){return 'rgba(122,63,168,'+a+')';};
var teaA=function(a){return 'rgba(23,127,117,'+a+')';};
var grnA=function(a){return 'rgba(61,143,61,'+a+')';};

/* ---------------- state ---------------- */
var S = {
  Zv:103, Zh:250, c:435,          /* c is slaved to near */
  near:435, far:675, halfW:100, halfH:50,
  trace:{x:100, y:50, z:560},
  showTrace:true, sweep:false, sweepU:0, sweepDone:false,
  showGl:true, showCS:true, showPin:false,
  showAxes:true, showLab:true, showGrid:true
};
var reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- projection helpers ---------------- */
var GM = window.GlideMath;
function proj(P){ return GM.project(P, S.c, S.Zv, S.Zh); }        /* cross-slit */
function glid(P){ return GM.glide(P, S.c, S.Zv, S.Zh, S.far); }   /* glide      */
function glidPin(P){ var Zp=(S.Zv+S.Zh)/2,
  s=(S.c-Zp)/(S.far-Zp), t=(P.z-S.c)/(S.far-S.c), m=1+t*(s-1);
  return {X:P.x*m, Y:P.y*m}; }
function zuPole(){ return S.c + (S.far - S.Zv); }  /* v pair depth (u exhausts) */
function zvPole(){ return S.c + (S.far - S.Zh); }  /* h pair depth (v exhausts) */
function zL(L){ return GM.zOfLevel(L, S.c, S.far); }
function depthLine(fn,x,y,z0,z1,N){
  var out=[], i, z;
  for(i=0;i<N;i++){ z=z0+(z1-z0)*i/(N-1); out.push(fn({x:x,y:y,z:z})); }
  return out;
}

/* ---------------- sheet layout ----------------
   world extents: x in [-150,150], y in [-150,150], z in [-60,1100]
   (the armature poles lie a full slit-to-back-wall distance behind
   the plane, so the plan runs tall). Uniform scale k; quadrants
   share the interior junction so the 45-degree transfer is exact. */
var cv=document.getElementById('sheet'), ctx=cv.getContext('2d');
if(!ctx) return;
var dpr=1, L={};   /* layout cache */
function layout(){
  var wrap=document.getElementById('sheetwrap');
  var cw=wrap.clientWidth-20, ch=wrap.clientHeight-20;
  if(cw<100||ch<100){ cw=960; ch=960; }   /* headless / zero-layout guard */
  dpr=Math.min(window.devicePixelRatio||1,3);
  var k=Math.min(cw/1460, ch/1460);
  var W=1460*k, H=1460*k;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  L.k=k;
  L.colX = 300*k;            /* junction x (plan|transfer, constr|side) */
  L.rowY = 1160*k;           /* junction y (top row | bottom row)       */
  L.W=W; L.H=H;
  L.fx  = function(x){ return (x+150)*k; };            /* plan x, image X */
  L.fzP = function(z){ return L.rowY-(z+60)*k; };      /* plan z (up)     */
  L.fzS = function(z){ return L.colX+(z+60)*k; };      /* side z (right)  */
  L.fy  = function(y){ return L.rowY+(150-y)*k; };     /* side y, image Y */
}

/* ---------------- drawing primitives ---------------- */
function line(x1,y1,x2,y2,col,w,dash){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w||1;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function poly(pts,col,w,dash,frac){
  var n=pts.length; if(frac!==undefined) n=Math.max(2,Math.round(n*frac));
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w||1;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<n;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke(); ctx.restore();
  return pts[n-1];
}
function dot(x,y,r,col,hollow){
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
  if(hollow){ ctx.strokeStyle=col; ctx.lineWidth=1.4;
    ctx.fillStyle=PAPER; ctx.fill(); ctx.stroke(); }
  else { ctx.fillStyle=col; ctx.fill(); }
  ctx.restore();
}
function cap(str,x,y,size,col,align){ /* tracked small caps */
  ctx.save(); ctx.fillStyle=col||inkA(.62);
  ctx.font='600 '+(size||9)+'px "Avenir Next","Futura","Century Gothic",sans-serif';
  ctx.textAlign=align||'left';
  ctx.fillText(str.toUpperCase().split('').join('\u2009'),x,y); ctx.restore();
}
function lab(str,x,y,size,col,align){ /* mixed-case point label */
  ctx.save(); ctx.fillStyle=col||INK;
  ctx.font='600 '+(size||10)+'px "Avenir Next","Futura",sans-serif';
  ctx.textAlign=align||'left';
  ctx.fillText(str,x,y); ctx.restore();
}
function num(str,x,y,size,col,align){ /* ruler numeral */
  ctx.save(); ctx.fillStyle=col||GRN;
  ctx.font='600 '+(size||9)+'px ui-monospace,Menlo,monospace';
  ctx.textAlign=align||'center';
  ctx.fillText(str,x,y); ctx.restore();
}
function clipRect(x,y,w,h){ ctx.save(); ctx.beginPath();
  ctx.rect(x,y,w,h); ctx.clip(); }

/* ---------------- render ---------------- */
function corners(){ return [
  {x: S.halfW, y: S.halfH}, {x:-S.halfW, y: S.halfH},
  {x: S.halfW, y:-S.halfH}, {x:-S.halfW, y:-S.halfH} ]; }

function draw(){
  var k=L.k;
  ctx.clearRect(0,0,L.W,L.H);

  /* faint sheet frame + quadrant rules */
  ctx.strokeStyle=inkA(.28); ctx.lineWidth=1;
  ctx.strokeRect(6,6,L.W-12,L.H-12);
  line(6,L.rowY,L.W-6,L.rowY,inkA(.18),1);
  line(L.colX,6,L.colX,L.H-6,inkA(.18),1);

  /* 45-degree transfer diagonal */
  line(L.colX,L.rowY, L.colX+1140*k, L.rowY-1140*k, inkA(.5),1);
  cap('45\u00b0 transfer', L.colX+16, L.rowY-1122*k+18, 9, inkA(.45));

  drawPlan(); drawSide(); drawConstruction();

  /* trace apparatus crosses quadrants — drawn unclipped, last */
  if(S.showTrace) drawTrace();
}

/* ---- shared: draw measured level ticks along a run of z ---- */
function levelStrokePlan(fz, xTick){
  for(var Lv=0; Lv<=16; Lv+=4){
    var z=zL(Lv), shared=(Lv===0||Lv===16);
    line(L.fx(-S.halfW),fz(z),L.fx(S.halfW),fz(z),
         shared?grnA(.9):(S.showGrid?inkA(.3):'rgba(0,0,0,0)'), shared?1.6:.7);
    num(String(Lv), xTick, fz(z)+3, 9, GRN, 'right');
  }
}

/* ---- PLAN (top-left): x horizontal, z increasing upward ---- */
function drawPlan(){
  clipRect(6,6,L.colX-6,L.rowY-6);
  var fx=L.fx, fz=L.fzP;
  cap('plan \u2014 top view', 14, 24, 9);

  /* picture plane, carried on the front face of the volume */
  line(10,fz(S.c),L.colX-10,fz(S.c),YEL,2.4);
  cap('picture plane \u00b7 front face \u00b7 level 0', 14, fz(S.c)+13, 8, YEL);

  /* room footprint + x-grid + measured levels */
  var xg, z;
  ctx.strokeStyle=inkA(.85); ctx.lineWidth=1.1;
  ctx.strokeRect(fx(-S.halfW),fz(S.far),fx(S.halfW)-fx(-S.halfW),fz(S.near)-fz(S.far));
  if(S.showGrid)
    for(xg=-S.halfW;xg<=S.halfW;xg+=50)
      line(fx(xg),fz(S.near),fx(xg),fz(S.far),inkA(.3),.7);
  levelStrokePlan(fz, fx(-S.halfW)-8);
  cap('back wall \u00b7 level 16', fx(-S.halfW), fz(S.far)-6, 8, GRN);

  /* ghost normal: the z-axis */
  if(S.showAxes) line(fx(0),fz(-40),fx(0),fz(zuPole()+40),purA(.5),1,[2,5]);

  /* cross-slit sight pencil: room corners -> red slit point */
  var xs=[-S.halfW,S.halfW], zs=[S.near,S.far], i, j;
  if(S.showCS) for(i=0;i<2;i++) for(j=0;j<2;j++)
    line(fx(xs[i]),fz(zs[j]),fx(0),fz(S.Zv),redA(.3),.8);

  /* glide armature: footprints -> the u pole at z = c+(far-Zv),
     entirely behind the picture plane; level dots equally spaced  */
  if(S.showGl){
    var feet = S.showGrid ? [-S.halfW,-S.halfW/2,S.halfW/2,S.halfW]
                          : [-S.halfW,S.halfW], Lv;
    for(i=0;i<feet.length;i++){
      line(fx(feet[i]),fz(S.c),fx(0),fz(zuPole()),teaA(.4),.8);
      for(Lv=0;Lv<=16;Lv+=4)
        dot(fx(feet[i]*(zuPole()-zL(Lv))/(zuPole()-S.c)),fz(zL(Lv)),1.4,teaA(.6));
    }
    dot(fx(0),fz(zuPole()),4.2,RED,true);
    cap('v pair \u00b7 z = c+(far\u2212Zv)', fx(8), fz(zuPole())+3, 8, RED);
  }

  /* blue slit edge-on, red slit as point */
  line(fx(-62),fz(S.Zh),fx(62),fz(S.Zh),BLUE,3);
  cap('blue slit \u00b7 edge', fx(66)+2, fz(S.Zh)+3, 8, BLUE);
  dot(fx(0),fz(S.Zv),4.6,RED);
  cap('point view of red slit', fx(8), fz(S.Zv)+13, 8, RED);

  if(S.showPin) dot(fx(0),fz((S.Zv+S.Zh)/2),3.6,ORG,true);
  ctx.restore();
}

/* ---- SIDE (bottom-right): z rightward, y upward ---- */
function drawSide(){
  clipRect(L.colX+1,L.rowY+1,L.W-L.colX-7,L.H-L.rowY-7);
  var fz=L.fzS, fy=L.fy, i, z, Lv;
  cap('side view \u2014 elevation', L.W-14, L.rowY+22, 9, inkA(.62),'right');

  line(fz(S.c),L.rowY+8,fz(S.c),L.H-10,YEL,2.4);
  cap('picture plane \u00b7 front face \u00b7 level 0', fz(S.c)-5, L.H-14, 8, YEL, 'right');

  ctx.strokeStyle=inkA(.85); ctx.lineWidth=1.1;
  ctx.strokeRect(fz(S.near),fy(S.halfH),fz(S.far)-fz(S.near),fy(-S.halfH)-fy(S.halfH));
  var yg;
  if(S.showGrid)
    for(yg=-S.halfH;yg<=S.halfH;yg+=50)
      line(fz(S.near),fy(yg),fz(S.far),fy(yg),inkA(.3),.7);
  for(Lv=0;Lv<=16;Lv+=4){
    z=zL(Lv); var shared=(Lv===0||Lv===16);
    line(fz(z),fy(-S.halfH),fz(z),fy(S.halfH),
         shared?grnA(.9):(S.showGrid?inkA(.3):'rgba(0,0,0,0)'), shared?1.6:.7);
    num(String(Lv), fz(z), fy(-S.halfH)+14, 9, GRN, 'center');
  }
  cap('back wall \u00b7 level 16', fz(S.far)+5, fy(S.halfH)-6, 8, GRN);

  if(S.showAxes){
    line(fz(-40),fy(0),fz(zuPole()+40),fy(0),purA(.5),1,[2,5]);
    cap('ghost normal', fz(S.far-90), fy(0)-6, 8, PUR);
  }

  /* cross-slit sight pencil: room corners -> blue slit point */
  var ys=[-S.halfH,S.halfH], zsS=[S.near,S.far], jj;
  if(S.showCS) for(i=0;i<2;i++) for(jj=0;jj<2;jj++)
    line(fz(zsS[jj]),fy(ys[i]),fz(S.Zh),fy(0),bluA(.3),.8);

  /* glide armature: footprints -> the v pole at z = c+(far-Zh) */
  if(S.showGl){
    var feet=[-S.halfH,S.halfH];
    for(i=0;i<feet.length;i++){
      line(fz(S.c),fy(feet[i]),fz(zvPole()),fy(0),teaA(.4),.8);
      for(Lv=0;Lv<=16;Lv+=4)
        dot(fz(zL(Lv)),fy(feet[i]*(zvPole()-zL(Lv))/(zvPole()-S.c)),1.4,teaA(.6));
    }
    dot(fz(zvPole()),fy(0),4.2,BLUE,true);
    cap('h pair \u00b7 z = c+(far\u2212Zh)', fz(zvPole())-6, fy(-12)+3, 8, BLUE,'right');
  }

  line(fz(S.Zv),fy(-62),fz(S.Zv),fy(62),RED,3);
  cap('red slit \u00b7 edge', fz(S.Zv)-4, fy(66)+14, 8, RED, 'right');
  dot(fz(S.Zh),fy(0),4.6,BLUE);
  cap('point view of blue slit', fz(S.Zh)+8, fy(-10)+3, 8, BLUE);

  if(S.showPin) dot(fz((S.Zv+S.Zh)/2),fy(0),3.6,ORG,true);
  ctx.restore();
}

/* ---- CONSTRUCTION (bottom-left): front view ----
   Both readings are calibrated on the measured levels: they agree
   at level 0 (front face, true size) and at level 16 (the shared
   back wall, green). Between, glide is straight and its level
   marks fall equally spaced; the cross-slit curves and its marks
   crowd toward A.                                                */
function drawConstruction(){
  clipRect(6,L.rowY+1,L.colX-6,L.H-L.rowY-7);
  var fx=L.fx, fy=L.fy, i, xg, yg, z, Lv;
  cap('front view \u00b7 measuring depth levels', 14, L.H-14, 9);

  var N=48, sweepFrac = S.sweep||S.sweepDone ? S.sweepU : 1;

  /* vanishing axes */
  if(S.showAxes){
    line(fx(0),L.rowY+8,fx(0),L.H-10,purA(.55),1,[2,5]);
    line(10,fy(0),L.colX-10,fy(0),purA(.55),1,[2,5]);
  }

  /* ---- cross-slit reading: curved depth lines toward A ---- */
  if(S.showCS){
    for(Lv=4; Lv<=12; Lv+=4){
      var qa=proj({x:-S.halfW,y: S.halfH,z:zL(Lv)}),
          qb=proj({x:S.halfW,y:-S.halfH,z:zL(Lv)});
      ctx.save(); ctx.strokeStyle=purA(.35); ctx.lineWidth=.7;
      ctx.strokeRect(fx(qa.X),fy(qa.Y),fx(qb.X)-fx(qa.X),fy(qb.Y)-fy(qa.Y));
      ctx.restore();
    }
    if(S.showGrid){
      for(xg=-S.halfW;xg<=S.halfW;xg+=50) for(i=0;i<2;i++)
        poly(depthLine(proj, xg, i? S.halfH:-S.halfH, S.near,S.far,N)
          .map(function(p){return [fx(p.X),fy(p.Y)];}), purA(.3),.7);
      for(yg=-S.halfH+50; yg<=S.halfH-50+1; yg+=50) for(i=0;i<2;i++)
        poly(depthLine(proj, i? S.halfW:-S.halfW, yg, S.near,S.far,N)
          .map(function(p){return [fx(p.X),fy(p.Y)];}), purA(.3),.7);
    }
    corners().forEach(function(cn){
      /* run past level 16 toward A, thin, to show it never arrives */
      poly(depthLine(proj,cn.x,cn.y,S.far,S.far+(S.far-S.c)*4,N)
        .map(function(p){return [fx(p.X),fy(p.Y)];}), purA(.35),.8,[2,4]);
      var pts=depthLine(proj,cn.x,cn.y,S.near,S.far,N)
        .map(function(p){return [fx(p.X),fy(p.Y)];});
      if(sweepFrac<1) poly(pts,purA(.25),1.5);
      var tip=poly(pts,PUR,1.5,null,sweepFrac);
      if(S.sweep && sweepFrac<1) dot(tip[0],tip[1],2.4,PUR);
      /* level marks crowd along the curve */
      for(Lv=0;Lv<=16;Lv+=4){ var q=proj({x:cn.x,y:cn.y,z:zL(Lv)});
        dot(fx(q.X),fy(q.Y),1.7,PUR); }
    });
    dot(fx(0),fy(0),2.8,PUR);
    lab('A', fx(0)+5, fy(0)+13, 10, PUR);
    cap('curved depth lines reach A only at \u221e', 14, L.rowY+22, 8, PUR);
  }

  /* ---- glide reading: straight measured armature ---- */
  if(S.showGl){
    /* full armature lines through both vanishing pairs */
    corners().forEach(function(cn){
      var a=glid({x:cn.x,y:cn.y,z:S.c}), b=glid({x:cn.x,y:cn.y,z:zuPole()+(S.far-S.c)*0.3});
      line(fx(a.X),fy(a.Y),fx(b.X),fy(b.Y),teaA(.35),.8,[2,4]);
    });
    for(Lv=4; Lv<=12; Lv+=4){
      var ga=glid({x:-S.halfW,y: S.halfH,z:zL(Lv)}),
          gb=glid({x:S.halfW,y:-S.halfH,z:zL(Lv)});
      ctx.save(); ctx.strokeStyle=teaA(.35); ctx.lineWidth=.7;
      ctx.strokeRect(fx(ga.X),fy(ga.Y),fx(gb.X)-fx(ga.X),fy(gb.Y)-fy(ga.Y));
      ctx.restore();
    }
    if(S.showGrid){
      for(xg=-S.halfW;xg<=S.halfW;xg+=50) for(i=0;i<2;i++)
        poly(depthLine(glid, xg, i? S.halfH:-S.halfH, S.near,S.far,N)
          .map(function(p){return [fx(p.X),fy(p.Y)];}), teaA(.3),.7);
      for(yg=-S.halfH+50; yg<=S.halfH-50+1; yg+=50) for(i=0;i<2;i++)
        poly(depthLine(glid, i? S.halfW:-S.halfW, yg, S.near,S.far,N)
          .map(function(p){return [fx(p.X),fy(p.Y)];}), teaA(.3),.7);
    }
    corners().forEach(function(cn){
      var pts=depthLine(glid,cn.x,cn.y,S.near,S.far,N)
        .map(function(p){return [fx(p.X),fy(p.Y)];});
      if(sweepFrac<1) poly(pts,teaA(.25),1.7);
      var tip=poly(pts,TEA,1.7,null,sweepFrac);
      if(S.sweep && sweepFrac<1) dot(tip[0],tip[1],2.6,TEA);
      /* level marks fall equally spaced along the straight line */
      for(Lv=0;Lv<=16;Lv+=4){ var g=glid({x:cn.x,y:cn.y,z:zL(Lv)});
        dot(fx(g.X),fy(g.Y),1.7,TEA); }
    });
    /* vanishing pairs */
    [ S.halfH,-S.halfH].forEach(function(y){
      var v=GM.vPoint(y,S.c,S.Zv,S.Zh,S.far);
      dot(fx(0),fy(v.Y),2.8,RED);
      lab(v.Y>0?'v2':'v1', fx(0)-7, fy(v.Y)+(v.Y>0?-6:14), 10, RED, 'right');
    });
    [ S.halfW,-S.halfW].forEach(function(x){
      var h=GM.hPoint(x,S.c,S.Zv,S.Zh,S.far);
      dot(fx(h.X),fy(0),2.8,BLUE);
      lab(h.X>0?'h1':'h2', fx(h.X)+(h.X>0?7:-7), fy(0)-7, 10, BLUE, h.X>0?'left':'right');
    });
    cap('h1 \u00b7 A \u00b7 h2 share one vanishing axis \u2014 the limit of measured depth',
        14, L.rowY+34, 8, inkA(.6));
    cap('v1 v2 \u00b7 directional \u00b7 deeper than the limit', 14, L.rowY+46, 8, RED);
  }

  /* pinhole comparison: slits fused — one-point measured armature */
  if(S.showPin){
    corners().forEach(function(cn){
      var a=glidPin({x:cn.x,y:cn.y,z:S.near}), b=glidPin({x:cn.x,y:cn.y,z:S.far});
      line(fx(a.X),fy(a.Y),fx(b.X),fy(b.Y),ORG,1.2);
    });
    var pa=glidPin({x:-S.halfW,y:S.halfH,z:S.far}),
        pb=glidPin({x:S.halfW,y:-S.halfH,z:S.far});
    ctx.save(); ctx.strokeStyle=ORG; ctx.lineWidth=.9; ctx.setLineDash([4,3]);
    ctx.strokeRect(fx(pa.X),fy(pa.Y),fx(pb.X)-fx(pa.X),fy(pb.Y)-fy(pa.Y));
    ctx.restore();
    cap('one-point armature \u00b7 slits fused', 14, L.rowY+58, 8, ORG);
  }

  /* the shared levels, drawn on top: level 0 in ink, level 16 in green */
  ctx.strokeStyle=inkA(.9); ctx.lineWidth=1.4;
  ctx.strokeRect(fx(-S.halfW),fy(S.halfH),
                 fx(S.halfW)-fx(-S.halfW),fy(-S.halfH)-fy(S.halfH));
  var bw=glid({x:S.halfW,y:S.halfH,z:S.far});
  ctx.strokeStyle=GRN; ctx.lineWidth=1.6;
  ctx.strokeRect(fx(-bw.X),fy(bw.Y),fx(bw.X)-fx(-bw.X),fy(-bw.Y)-fy(bw.Y));
  cap('front face \u00b7 level 0 \u00b7 true size', fx(-S.halfW), fy(S.halfH)-8, 7.5, inkA(.55));
  if(S.showLab) corners().forEach(function(cn){
    var ix = cn.x>0 ? '2':'1', iy = cn.y>0 ? '2':'1';
    var lx=fx(cn.x)+(cn.x>0? 6:-6), ly=fy(cn.y)+(cn.y>0? -8:16);
    ctx.save();
    ctx.font='600 12px "Avenir Next","Futura",sans-serif';
    ctx.fillStyle=INK;
    var ax = lx + (cn.x>0?0:-14);
    ctx.fillText('A', ax, ly);
    ctx.font='600 8.5px "Avenir Next","Futura",sans-serif';
    ctx.fillStyle=RED;  ctx.fillText(iy, ax+9, ly+3);
    ctx.fillStyle=BLUE; ctx.fillText(ix, ax+14, ly+3);
    ctx.restore();
  });
  cap('back wall \u00b7 level 16 \u00b7 shared by both readings', fx(-bw.X), fy(bw.Y)-5, 7.5, GRN);

  /* measured-level ruler: ticks ride the glide's left edge, so the
     scale is linear and the drops are vertical                     */
  var ry=L.rowY+72;
  line(fx(-S.halfW)-4, ry, fx(0)+6, ry, grnA(.8), 1);
  for(Lv=0;Lv<=16;Lv+=4){
    var gx=fx(-S.halfW*(1+((zL(Lv)-S.c)/(S.far-S.c))*((S.c-S.Zv)/(S.far-S.Zv)-1)));
    line(gx,ry-4,gx,ry+4,GRN,1.2);
    num(String(Lv), gx, ry-8, 9, GRN, 'center');
    var gyTop=fy(S.halfH*(1+((zL(Lv)-S.c)/(S.far-S.c))*((S.c-S.Zh)/(S.far-S.Zh)-1)));
    line(gx,ry+4,gx,gyTop,grnA(.35),.7);
  }
  var hL=GM.hPoint(-S.halfW,S.c,S.Zv,S.Zh,S.far);
  line(fx(hL.X),ry-4,fx(hL.X),ry+4,BLUE,1.2);
  num('h', fx(hL.X), ry-8, 9, BLUE, 'center');
  line(fx(0),ry-4,fx(0),ry+4,RED,1.2);
  num('v', fx(0)-6, ry-8, 9, RED, 'center');
  lab('\u221e', fx(0)+8, ry-6, 11, PUR);
  num('A', fx(0)+18, ry-7, 8, PUR, 'center');
  cap('depth levels read equally spaced on the glide \u00b7 crowd on the cross-slit',
      14, L.H-28, 7.5, inkA(.55));
  ctx.restore();
}

/* ---- TRACE: the four-quadrant construction for one point,
        in whichever readings are switched on                 ---- */
function drawTrace(){
  var t=S.trace, fx=L.fx, fzP=L.fzP, fzS=L.fzS, fy=L.fy;
  /* shared: orthographic drops to the footprints on the plane */
  line(fx(t.x),fzP(t.z),fx(t.x),fzP(S.c),inkA(.5),1,[5,4]);
  dot(fx(t.x),fzP(S.c),2.4,YEL); dot(fx(t.x),fzP(S.c),1.1,INK);
  line(fzS(t.z),fy(t.y),fzS(S.c),fy(t.y),inkA(.5),1,[5,4]);
  dot(fzS(S.c),fy(t.y),2.4,YEL); dot(fzS(S.c),fy(t.y),1.1,INK);

  if(S.showGl){                                /* glide reading  */
    var g=glid(t);
    line(fx(t.x),fzP(S.c),fx(0),fzP(zuPole()),teaA(.9),1.5);
    dot(fx(g.X),fzP(t.z),2.4,TEA);
    line(fzS(S.c),fy(t.y),fzS(zvPole()),fy(0),teaA(.9),1.5);
    dot(fzS(t.z),fy(g.Y),2.4,TEA);
    line(fx(g.X),fzP(t.z),fx(g.X),fy(g.Y),teaA(.6),1,[5,4]);
    line(fzS(t.z),fy(g.Y),fx(g.X),fy(g.Y),teaA(.6),1,[5,4]);
    dot(fx(g.X),fy(g.Y),3.2,TEA);
    line(fx(g.X)-8,fy(g.Y),fx(g.X)+8,fy(g.Y),TEA,.8);
    line(fx(g.X),fy(g.Y)-8,fx(g.X),fy(g.Y)+8,TEA,.8);
  }
  if(S.showCS){                                /* cross-slit reading */
    var q=proj(t);
    line(fx(t.x),fzP(t.z),fx(0),fzP(S.Zv),redA(.85),1.3);
    dot(fx(q.X),fzP(S.c),2.2,YEL); dot(fx(q.X),fzP(S.c),1,INK);
    line(fzS(t.z),fy(t.y),fzS(S.Zh),fy(0),bluA(.85),1.3);
    dot(fzS(S.c),fy(q.Y),2.2,YEL); dot(fzS(S.c),fy(q.Y),1,INK);
    line(fx(q.X),fzP(S.c),fx(q.X),fy(q.Y),purA(.55),1,[5,4]);
    line(fzS(S.c),fy(q.Y),fx(q.X),fy(q.Y),purA(.55),1,[5,4]);
    dot(fx(q.X),fy(q.Y),3.2,PUR);
    line(fx(q.X)-8,fy(q.Y),fx(q.X)+8,fy(q.Y),PUR,.8);
    line(fx(q.X),fy(q.Y)-8,fx(q.X),fy(q.Y)+8,PUR,.8);
  }
  /* 45-degree z transfer: plan point -> diagonal -> side point */
  line(fx(t.x),fzP(t.z),fzS(t.z),fzP(t.z),inkA(.35),1,[3,5]);
  line(fzS(t.z),fzP(t.z),fzS(t.z),fy(t.y),inkA(.35),1,[3,5]);
  dot(fzS(t.z),fzP(t.z),2,INK,true);
  /* handles */
  dot(fx(t.x),fzP(t.z),5,INK,true); dot(fx(t.x),fzP(t.z),1.8,INK);
  dot(fzS(t.z),fy(t.y),5,INK,true); dot(fzS(t.z),fy(t.y),1.8,INK);
}

function bowDeviation(fn){
  var pts=depthLine(fn,S.halfW,S.halfH,S.near,S.far,33);
  var a=pts[0], b=pts[pts.length-1];
  var dx=b.X-a.X, dy=b.Y-a.Y, Lc=Math.hypot(dx,dy)||1, m=0;
  pts.forEach(function(p){
    var d=Math.abs(dx*(p.Y-a.Y)-dy*(p.X-a.X))/Lc; if(d>m)m=d; });
  return m;
}
function backWallGap(){
  var m=0;
  corners().forEach(function(cn){
    var g=glid({x:cn.x,y:cn.y,z:S.far}), q=proj({x:cn.x,y:cn.y,z:S.far});
    m=Math.max(m,Math.hypot(g.X-q.X,g.Y-q.Y)); });
  return m;
}

/* ---------------- interaction ----------------
   house drag pattern: pointerdown on canvas, move/up on window
   filtered by pointerId — no reliance on capture transfer.       */
var drag=null, dragPID=null;
function hits(px,py){
  var fx=L.fx, fzP=L.fzP, fzS=L.fzS, fy=L.fy, t=S.trace, R=17;
  var H=[
    {id:'traceP', x:fx(t.x),   y:fzP(t.z)},
    {id:'traceS', x:fzS(t.z),  y:fy(t.y)},
    {id:'redP',   x:fx(0),     y:fzP(S.Zv)},
    {id:'blueS',  x:fzS(S.Zh), y:fy(0)}
  ];
  for(var i=0;i<H.length;i++)
    if(Math.hypot(px-H[i].x,py-H[i].y)<R) return {id:H[i].id};
  if(px<L.colX && Math.abs(py-fzP(S.c))<10)  return {id:'yelP'};
  if(px>L.colX && Math.abs(px-fzS(S.c))<10 && py>L.rowY) return {id:'yelS'};
  if(px>L.colX && Math.abs(px-fzS(S.Zv))<9 && py>L.rowY) return {id:'redS'};
  if(px<L.colX && Math.abs(py-fzP(S.Zh))<9 && py<L.rowY) return {id:'blueP'};
  return null;
}
function clampAll(){
  S.Zv=Math.min(Math.max(S.Zv,60),330-0.5);
  S.Zh=Math.min(Math.max(S.Zh,S.Zv+0.5),330);
  S.near=Math.max(S.near,S.Zh+90);
  S.far=Math.max(S.far,S.near+60);
  S.c=S.near;    /* picture plane always contains the front face */
  S.trace.z=Math.min(Math.max(S.trace.z,S.near),S.far);
  S.trace.x=Math.min(Math.max(S.trace.x,-S.halfW),S.halfW);
  S.trace.y=Math.min(Math.max(S.trace.y,-S.halfH),S.halfH);
  syncSliders();
}
function invPlan(px,py){ return {x:px/L.k-150, z:(L.rowY-py)/L.k-60}; }
function invSide(px,py){ return {z:(px-L.colX)/L.k-60, y:150-(py-L.rowY)/L.k}; }
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  drag=hits(px,py);
  if(drag){ dragPID=e.pointerId; e.preventDefault(); }
});
window.addEventListener('pointermove',function(e){
  if(!drag || e.pointerId!==dragPID) return;
  var r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  var P=invPlan(px,py), Q=invSide(px,py);
  switch(drag.id){
    case 'traceP': S.trace.x=P.x; S.trace.z=P.z; break;
    case 'traceS': S.trace.y=Q.y; S.trace.z=Q.z; break;
    case 'redP':  S.Zv=P.z; break;
    case 'redS':  S.Zv=Q.z; break;
    case 'blueP': S.Zh=P.z; break;
    case 'blueS': S.Zh=Q.z; break;
    case 'yelP':  S.near=P.z;  break;   /* yellow carries the front face */
    case 'yelS':  S.near=Q.z;  break;
  }
  clampAll(); needsDraw=true;
});
window.addEventListener('pointerup',function(e){
  if(e.pointerId===dragPID){ drag=null; dragPID=null; }
});
window.addEventListener('pointercancel',function(e){
  if(e.pointerId===dragPID){ drag=null; dragPID=null; }
});

/* ---------------- tray wiring ---------------- */
function $(id){ return document.getElementById(id); }
var sliders=[['sZv','Zv'],['sZh','Zh'],['sNear','near'],['sFar','far']];
sliders.forEach(function(sv){
  $(sv[0]).addEventListener('input',function(){
    S[sv[1]]=parseFloat(this.value); clampAll(); needsDraw=true; });
});
function syncSliders(){
  $('sZv').value=S.Zv; $('vZv').textContent=S.Zv.toFixed(0);
  $('sZh').value=S.Zh; $('vZh').textContent=S.Zh.toFixed(0);
  $('sZh').min=(S.Zv+1).toFixed(0);
  $('sNear').value=S.near; $('vNear').textContent=S.near.toFixed(0);
  $('sFar').value=S.far;  $('vFar').textContent=S.far.toFixed(0);
  $('readout').innerHTML='back-wall gap <b>'+backWallGap().toFixed(1)+' u</b>'+
    ' &nbsp; glide bow <b>'+bowDeviation(glid).toFixed(1)+' u</b>'+
    ' &nbsp; cross-slit bows <b>'+bowDeviation(proj).toFixed(1)+' u</b>';
}
function chip(id,key,cb){
  $(id).addEventListener('click',function(){
    S[key]=!S[key]; this.setAttribute('aria-pressed',S[key]);
    if(cb)cb(); needsDraw=true; });
}
chip('cTrace','showTrace'); chip('cGl','showGl'); chip('cCS','showCS');
chip('cPin','showPin');
chip('cAxes','showAxes');   chip('cLab','showLab'); chip('cGrid','showGrid');
$('cSweep').addEventListener('click',function(){
  S.sweep=!S.sweep; this.setAttribute('aria-pressed',S.sweep);
  if(S.sweep){ S.sweepU=reduceMotion?1:0; S.sweepDone=false; }
  else { S.sweepU=1; S.sweepDone=false; }
  needsDraw=true;
});

/* ---------------- loop ---------------- */
var needsDraw=true;
function tick(){
  if(S.sweep && S.sweepU<1){ S.sweepU=Math.min(1,S.sweepU+0.007); needsDraw=true;
    if(S.sweepU>=1){ S.sweep=false; S.sweepDone=false;
      $('cSweep').setAttribute('aria-pressed','false'); } }
  if(needsDraw){ draw(); needsDraw=false; }
  requestAnimationFrame(tick);
}
function onResize(){ layout(); clampAll(); needsDraw=true; }
window.addEventListener('resize',onResize);
layout(); clampAll(); needsDraw=true;
if (typeof requestAnimationFrame==='function') tick(); else draw();
})();
</script>
